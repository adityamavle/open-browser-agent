<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Microsoft Surface Laptop 13-inch - Best Buy</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      table { border-collapse: collapse; width: 100%; max-width: 40rem; }
      th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
      .priceView-customer-price { font-size: 1.5rem; font-weight: bold; margin: 1rem 0; }
    </style>
  </head>
  <body>
    <main>
      <h1 class="heading-5 v-fw-regular" data-testid="product-title">
        Microsoft Surface Laptop 13-inch - Snapdragon X Plus - 16GB Memory - 512GB SSD
      </h1>
      <div class="priceView-customer-price">
        <span aria-hidden="true">$999.00</span>
      </div>
      <div class="product-data">
        <span data-testid="product-sku">SKU: 6540002</span>
      </div>
      <section data-testid="specifications" class="shop-specifications">
        <table>
          <tbody>
            <tr>
              <th>Display Size</th>
              <td>13 inches</td>
            </tr>
            <tr>
              <th>System Memory (RAM)</th>
              <td>16 gigabytes</td>
            </tr>
            <tr>
              <th>Storage Type</th>
              <td>SSD</td>
            </tr>
            <tr>
              <th>Solid State Drive Capacity</th>
              <td>512 gigabytes</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
